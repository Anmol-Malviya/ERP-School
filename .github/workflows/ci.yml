name: ERP CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/erp-school-test?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start MongoDB replica set
        run: |
          docker run -d --name erp-mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if docker exec erp-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then break; fi
            sleep 1
          done
          docker exec erp-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do
            if docker exec erp-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then break; fi
            sleep 1
          done
      - run: npm install --no-audit --no-fund
      - name: Verify app module graph
        run: node -e "require('./src/app'); console.log('app import ok')"
      - run: npm test
      - run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

  school-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

  superadmin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Superadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Superadmin/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
